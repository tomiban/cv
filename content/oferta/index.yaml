etiqueta: "Tomás Banchio · Esperanza, Santa Fe"
titular: "Desarrollador full stack."
bajada: "Técnico en Desarrollo de Software, con más de 3 años construyendo sistemas web en producción, como App Santa Fe, que ya superó los 10.000 usuarios. Me enfoco en el producto: que resuelva un problema real, que la gente lo use y que pueda crecer con tu negocio. Trabajo freelance o full-time, para empresas, organismos y equipos."
mensajeWhatsapp: "Hola Tomás, vi tu web y quiero contarte sobre un proyecto."
servicios:
  - titulo: "Consultoría y relevamiento"
    descripcion: "Antes de escribir código, entendemos juntos el problema: qué proceso querés resolver, quién lo va a usar y qué tiene que pasar para que funcione. Salís con un plan claro de qué construir y en qué orden."
    para: "Ideas que todavía no tienen forma, o proyectos trabados."
  - titulo: "Sistemas a medida"
    descripcion: "Backoffices, gestión de trámites, turnos, stock o clientes. Reemplazan planillas y cadenas de mails por un sistema ordenado, donde cada persona ve y hace solo lo que le corresponde."
    para: "Pymes, municipios y equipos que crecieron más rápido que sus herramientas."
  - titulo: "Integraciones"
    descripcion: "Que tus clientes puedan pagar online, que tu equipo entre con un solo usuario a todas sus herramientas y que tus sistemas se pasen los datos solos, sin cargar lo mismo dos veces."
    para: "Sistemas que ya existen pero no se hablan entre sí."
  - titulo: "Webs y landings"
    descripcion: "Sitios rápidos y fáciles de editar, pensados para que quien entra te escriba. Con dominio propio, una buena base para aparecer en Google y botón de WhatsApp o formulario."
    para: "Profesionales y negocios que necesitan una web para recibir consultas."
  - titulo: "Apps con IA"
    descripcion: "Asistentes que trabajan con la información de tu empresa, con control de quién accede a qué. IA aplicada a un proceso concreto, no de adorno."
    para: "Empresas que quieren usar IA sobre sus propios datos."
pasos:
  - titulo: "Charla inicial"
    descripcion: "Me contás qué necesitás por WhatsApp o en una llamada corta. Si no soy la persona indicada, te lo digo."
  - titulo: "Propuesta"
    descripcion: "Alcance, plazos y presupuesto por escrito, en lenguaje claro. Sin letra chica."
  - titulo: "Desarrollo con entregas"
    descripcion: "Avances cortos que podés probar. Ajustamos sobre algo real, no sobre un documento."
  - titulo: "Puesta en marcha"
    descripcion: "Lo dejo funcionando en tu servidor o en la nube, con acceso para tu equipo."
