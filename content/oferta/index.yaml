etiqueta: "Tomás Banchio · Esperanza, Santa Fe"
titular: "Desarrollador full stack."
bajada: "Técnico en Desarrollo de Software, con más de 3 años construyendo sistemas web que hoy usan miles de personas. Código prolijo, seguro y fácil de mantener, entregado en etapas que podés probar. Trabajo freelance o full-time, para empresas, organismos y equipos."
mensajeWhatsapp: "Hola Tomás, vi tu web y quiero contarte sobre un proyecto."
servicios:
  - titulo: "Consultoría y relevamiento"
    descripcion: "Antes de escribir código, entendemos el problema: qué proceso querés resolver, quién lo usa y qué tiene que pasar para que funcione. Salís con un alcance claro y un backlog listo para construir."
    para: "Ideas que todavía no tienen forma, o proyectos trabados."
  - titulo: "Sistemas a medida"
    descripcion: "Backoffices, gestión de trámites, turnos, stock o clientes. Aplicaciones web que reemplazan planillas y mails por un flujo ordenado, con permisos por usuario."
    para: "Pymes, municipios y equipos que crecieron más rápido que sus herramientas."
  - titulo: "Integraciones"
    descripcion: "Cobros con Mercado Pago y otras pasarelas, login único (OIDC, Keycloak), APIs entre sistemas y automatizaciones para que los datos no se carguen dos veces."
    para: "Sistemas que ya existen pero no se hablan entre sí."
  - titulo: "Webs y landings"
    descripcion: "Sitios rápidos, bien posicionados y fáciles de editar, pensados para que el visitante te escriba. Con dominio, SEO técnico y formulario o WhatsApp."
    para: "Profesionales y negocios que necesitan presencia que convierta."
  - titulo: "Apps con IA"
    descripcion: "Agentes y asistentes que trabajan con la información de tu empresa, con control de quién accede a qué. IA aplicada a un proceso concreto, no de adorno."
    para: "Empresas que quieren usar IA sobre sus propios datos."
pasos:
  - titulo: "Charla inicial"
    descripcion: "Me contás qué necesitás por WhatsApp o en una llamada corta. Si no soy la persona indicada, te lo digo."
  - titulo: "Propuesta"
    descripcion: "Alcance, plazos y presupuesto por escrito, en lenguaje claro. Sin letra chica."
  - titulo: "Desarrollo con entregas"
    descripcion: "Avances cortos que podés probar. Ajustamos sobre algo real, no sobre un documento."
  - titulo: "Deploy y soporte"
    descripcion: "Lo dejo funcionando en tu servidor o en la nube, con acceso para tu equipo y soporte después de la entrega."
