nombre: "App Santa Fe"
empleador: "Crombie"
cliente: "Municipalidad de Santa Fe"
descripcion: "Centraliza en una sola app los trámites municipales de la ciudad. Superó los 10.000 usuarios, que inician y pagan trámites desde el celular, mientras el equipo municipal los procesa desde un backoffice propio. El desafío fue combinar pagos online con dos pasarelas, identidad centralizada y un despliegue on-premise donde la infraestructura la manejamos nosotros."
desafio: "Los vecinos tenían que ir en persona para iniciar y pagar trámites, y el municipio los procesaba a mano."
solucion:
  - "App para iniciar y pagar trámites desde el celular."
  - "Cobros online con Mercado Pago y Plus Pago."
  - "Login centralizado con OIDC y Keycloak."
  - "Backoffice para que el equipo municipal gestione cada trámite."
  - "Despliegue on-premise con Docker, sobre infraestructura propia."
resultado: "Más de 10.000 usuarios que hoy resuelven trámites sin hacer fila."
stack: "React · TypeScript · NestJS · SQL · Docker"
web: "https://santafeciudad.gov.ar/appsantafe/"
orden: 1
