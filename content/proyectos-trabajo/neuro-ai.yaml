nombre: "Neuro AI"
empleador: "Neuronic"
cliente: "Plataforma SaaS para empresas"
descripcion: "Plataforma donde las empresas crean agentes de IA a medida y los comparten entre equipos, con control de quién accede a qué dentro de cada organización. El foco estuvo en el modelo de permisos: que cada organización gestione sus agentes, usuarios y accesos de forma aislada."
desafio: "Empresas que querían crear agentes de IA propios y compartirlos entre equipos sin perder control de quién ve qué."
solucion:
  - "Interfaces para crear y gestionar agentes, usuarios y permisos."
  - "Modelo de acceso aislado por organización."
  - "Integraciones con sistemas empresariales vía APIs REST en .NET."
resultado: "Cada organización administra sus agentes y accesos de forma independiente."
stack: "Next.js · C# · ASP.NET Core"
web: "https://ai.neuronic.tech/"
orden: 2
